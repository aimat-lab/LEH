# Hyperparameter stage 2 on the final dataset: model size (user: check L=2 and >32 channels on >= 30k molecules).
# 30k training molecules (nested subset of the 100k split), same validation subset and tests as stage 1.
# Training setup fixed in advance (batch 16, peak lr 3e-3, cosine, EMA 0.99, 150k updates) because stage 1 runs in
# parallel; the comparison is between architectures at identical training settings.
outdir: experiments/wb97/runs_hp
base:
  data: data/wb97_all_100k.pkl
  split: experiments/wb97/split_100k_sub30k.json
  head: latent
  head_kwargs: {k: 1}
  n_states: 10
  n_sup: 10
  n_force: 3
  dtype: float64
  enc_kwargs: {channels: 32, max_L: 1, num_interactions: 2, r_max: 5.0}
  w_gap: 1.0
  w_e0: 10.0
  w_f0: 10.0
  w_fex: 10.0
  ema_decay: 0.99
  lr_schedule: cosine
  warmup_updates: 1000
  max_updates: 150000
  epochs: 100000
  patience: 100000
  max_hours: 80.0
  wall_hours: 7.0
  threads: 6
  batch_size: 16
  lr: 0.003
runs:
  - {name: hp2_c32_L1, enc_kwargs: {channels: 32, max_L: 1, num_interactions: 2, r_max: 5.0}}
  - {name: hp2_c64_L1, enc_kwargs: {channels: 64, max_L: 1, num_interactions: 2, r_max: 5.0}}
  - {name: hp2_c128_L1, enc_kwargs: {channels: 128, max_L: 1, num_interactions: 2, r_max: 5.0}}
  - {name: hp2_c64_L2, enc_kwargs: {channels: 64, max_L: 2, num_interactions: 2, r_max: 5.0}}
  - {name: hp2_c128_L2, enc_kwargs: {channels: 128, max_L: 2, num_interactions: 2, r_max: 5.0}}
