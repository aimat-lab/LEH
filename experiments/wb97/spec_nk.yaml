# Fixed-budget sampling test (user request 2026-10-16): N molecules x K geometries at constant N*K, thermal geometries
# only (experiments/wb97/make_nk_splits.py). LEH, final settings identical to the ablations (128 ch L1, b16, lr 3e-3,
# cosine, EMA 0.99, w_e0 100, 100k updates), same val/test sets as the learning curves, 3 seeds each.
outdir: experiments/wb97/runs_nk
base:
  data: data/wb97_all_100k_s1.pkl
  head_kwargs: {}
  n_states: 10
  n_sup: 10
  n_force: 3
  dtype: float64
  enc_kwargs: {channels: 128, max_L: 1, num_interactions: 2, r_max: 5.0}
  w_gap: 1.0
  w_e0: 100.0
  w_f0: 10.0
  w_fex: 10.0
  ema_decay: 0.99
  lr_schedule: cosine
  warmup_updates: 1000
  max_updates: 100000
  epochs: 100000
  patience: 100000
  max_hours: 40.0
  wall_hours: 7.0
  threads: 6
  batch_size: 16
  lr: 0.003
runs:
- name: nk_G20k_K1_s0
  seed: 0
  head: latent
  head_kwargs: {k: 1}
  split: experiments/wb97/split_100k_s1_nk_G20k_K1.json
- name: nk_G20k_K1_s1
  seed: 1
  head: latent
  head_kwargs: {k: 1}
  split: experiments/wb97/split_100k_s1_nk_G20k_K1.json
- name: nk_G20k_K1_s2
  seed: 2
  head: latent
  head_kwargs: {k: 1}
  split: experiments/wb97/split_100k_s1_nk_G20k_K1.json
- name: nk_G20k_K2_s0
  seed: 0
  head: latent
  head_kwargs: {k: 1}
