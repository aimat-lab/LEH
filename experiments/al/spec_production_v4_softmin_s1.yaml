# Second production softmin seed (user OK 2026-10-25, fair 2-vs-2 comparison with LEH)
outdir: experiments/al/runs
base:
  data: data/wb97_prod_v4.pkl
  split: experiments/al/split_prod_v4.json
  head_kwargs: {}
  n_states: 10
  n_sup: 10
  n_force: 3
  dtype: float64
  enc_kwargs:
    channels: 128
    max_L: 1
    num_interactions: 2
    r_max: 5.0
  w_gap: 1.0
  w_e0: 100.0
  w_f0: 10.0
  w_fex: 10.0
  ema_decay: 0.99
  lr_schedule: cosine
  warmup_updates: 1000
  max_updates: 300000
  epochs: 100000
  patience: 100000
  max_hours: 80.0
  wall_hours: 7.0
  threads: 6
  batch_size: 16
  lr: 0.003
runs:
- name: prod_softmin_v4_s1
  seed: 1
  head: softmin
