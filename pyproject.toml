[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leh-mace"
version = "1.0.0"
description = "LEH-MACE: a local excitation Hamiltonian for transferable and size-consistent excited-state machine-learned potentials"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pascal Friederich", email = "pascal.friederich@kit.edu"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "mace-torch==0.3.16", "e3nn==0.4.4", "numpy", "scipy", "ase", "h5py", "pyyaml", "rdkit", "matplotlib"]

[tool.setuptools.packages.find]
include = ["exmlip*"]
